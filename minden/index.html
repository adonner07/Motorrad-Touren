    try { s = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { s = null; }
    if (!s || !DATA[s.route]) s = { route: 'mitte', dir: 'hin', done: {} };
    if (!s.done) s.done = {};
    return s;
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* privater Modus */ } }
  function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function hours(min, f) {
    var h = min * f / 60, r = Math.round(h * 2) / 2;
    return (r % 1 ? Math.floor(r) + '½' : String(r));
  }
  function timeRange(min) { return 'ca. ' + hours(min, .88) + '–' + hours(min, 1) + ' Std.'; }
  function waze(st) {
    return 'https://waze.com/ul?q=' + encodeURIComponent(st.name) + '&ll=' + st.lat.toFixed(5) + '%2C' + st.lon.toFixed(5) + '&navigate=yes';
  }
  // Etappen in Fahrtrichtung: auf dem Rückweg umgedreht, Kilometer und „über …“ wandern mit
  function stages(key, dir) {
    var f = DATA[key].etappen;
    if (dir === 'hin') return f.map(function (s) { return s; });
    var out = [], cum = 0;
    for (var i = f.length - 1; i >= 0; i--) {
      var nxt = f[i + 1];
      var km = nxt ? nxt.km : 0;
      cum += km;
      out.push({ name: f[i].name, note: i === 0 ? 'Ziel' : (i === f.length - 1 ? 'Start' : f[i].note), lat: f[i].lat, lon: f[i].lon,
        km: km, min: nxt ? nxt.min : 0, cum: cum, via: nxt ? nxt.via.slice().reverse() : [], tank: f[i].tank });
    }
    return out;
  }
  function progressKey() { return state.route + ':' + state.dir; }
  // Fortschritt: wie viele Etappen geschafft sind (0 = noch keine)
  function doneCount(list) { return Math.min(state.done[progressKey()] || 0, list.length - 1); }

  /* ---------- Karte ---------- */
  var W = 600, H = 640, PAD = 34, box;
  (function bounds() {
    var la = [], lo = [];
    ORDER.forEach(function (k) { DATA[k].linie.forEach(function (p) { la.push(p[0]); lo.push(p[1]); }); });
    var lat0 = Math.min.apply(null, la), lat1 = Math.max.apply(null, la), lon0 = Math.min.apply(null, lo), lon1 = Math.max.apply(null, lo);
    var k = Math.cos((lat0 + lat1) / 2 * Math.PI / 180);
    var sx = (W - 2 * PAD) / ((lon1 - lon0) * k), sy = (H - 2 * PAD) / (lat1 - lat0), s = Math.min(sx, sy);
    box = { lat1: lat1, lon0: lon0, k: k, s: s, ox: (W - (lon1 - lon0) * k * s) / 2, oy: (H - (lat1 - lat0) * s) / 2 };
  })();
  function xy(lat, lon) { return [box.ox + (lon - box.lon0) * box.k * box.s, box.oy + (box.lat1 - lat) * box.s]; }
  function path(pts) { return pts.map(function (p, i) { var q = xy(p[0], p[1]); return (i ? 'L' : 'M') + q[0].toFixed(1) + ' ' + q[1].toFixed(1); }).join(''); }
  function drawMap() {
    var R = DATA[state.route], out = '';
    for (var g = 40; g < W; g += 40) out += '<path class="m-grid" d="M' + g + ' 0V' + H + '"/>';
    for (var h = 40; h < H; h += 40) out += '<path class="m-grid" d="M0 ' + h + 'H' + W + '"/>';
    out += '<g class="m-ref">' + REF.map(function (r) {
      var q = xy(r[1], r[2]);
      return '<circle cx="' + q[0].toFixed(1) + '" cy="' + q[1].toFixed(1) + '" r="3"/><text x="' + (q[0] + 7).toFixed(1) + '" y="' + (q[1] + 4).toFixed(1) + '">' + r[0] + '</text>';
    }).join('') + '</g>';
    ORDER.forEach(function (k) { if (k !== state.route) out += '<path class="m-line" d="' + path(DATA[k].linie) + '" stroke="' + DATA[k].farbe + '"/>'; });
    out += '<path class="m-glow" d="' + path(R.linie) + '" stroke="' + R.farbe + '"/>';
    out += '<path class="m-line on" d="' + path(R.linie) + '" stroke="' + R.farbe + '"/>';
    var list = stages(state.route, 'hin');
    list.forEach(function (s, i) {
      var q = xy(s.lat, s.lon), end = i === 0 || i === list.length - 1;
      out += '<circle class="' + (end ? 'm-end' : 'm-stage') + '" cx="' + q[0].toFixed(1) + '" cy="' + q[1].toFixed(1) + '" r="' + (end ? 7 : 4.5) + '" fill="' + R.farbe + '"/>';
    });
    var ends = [xy(list[0].lat, list[0].lon), xy(list[list.length - 1].lat, list[list.length - 1].lon)];
    list.forEach(function (s, i) {
      var q = xy(s.lat, s.lon), end = i === 0 || i === list.length - 1;
      if (!end && !s.note) return;
      // keine Beschriftung, wenn sie Start oder Ziel verdecken würde
      if (!end && ends.some(function (e) { return Math.abs(e[1] - q[1]) < 16 && Math.abs(e[0] - q[0]) < 60; })) return;
      var left = q[0] > W * .62;
      out += '<text class="m-label' + (end ? '' : ' small') + '" x="' + (q[0] + (left ? -10 : 10)).toFixed(1) + '" y="' + (q[1] + 4).toFixed(1) + '" text-anchor="' + (left ? 'end' : 'start') + '">' + esc(s.name) + '</text>';
    });
    var map = $('map');
    map.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    map.innerHTML = out;
  }

  /* ---------- Strecken ---------- */
  function drawCards() {
    $('routes').innerHTML = ORDER.map(function (k) {
      var R = DATA[k];
      return '<button type="button" class="route-card" data-route="' + k + '" aria-pressed="' + (k === state.route) + '" style="--c:' + R.farbe + '">' +
        '<span class="rc-top"><span class="rc-dot" aria-hidden="true"></span><span class="rc-name">' + esc(R.name) + '</span></span>' +
        '<span class="rc-sub" style="display:block">' + esc(R.sub) + '</span>' +
        '<span class="rc-stats" style="display:flex"><span><b style="color:var(--text)">' + R.km + '</b> km</span><span>' + timeRange(R.min) + '</span><span>' + (R.art.A ? R.art.A + ' km Autobahn' : 'ohne Autobahn') + '</span></span>' +
        '</button>';
    }).join('');
  }
  function drawDetail() {
    var R = DATA[state.route], list = stages(state.route, state.dir);
    var last = list.length - 1, done = doneCount(list), finished = done >= last, cur = Math.min(done + 1, last);
    var t = list[cur], from = list[cur - 1];
    var total = R.art.A + R.art.B + R.art.L;
    var pct = function (v) { return (v / total * 100).toFixed(1) + '%'; };
    var html =
      '<div class="detail-head" style="--c:' + R.farbe + '"><h2>' + esc(R.name) + '</h2><p>' + esc(R.text) + '</p>' +
      '<div class="mix" aria-hidden="true"><i style="width:' + pct(R.art.L) + ';background:' + R.farbe + '"></i><i style="width:' + pct(R.art.B) + ';background:rgba(255,255,255,.45)"></i><i style="width:' + pct(R.art.A) + ';background:#ff5d5d"></i></div>' +
      '<ul class="mix-legend"><li><i style="background:' + R.farbe + '"></i><b>' + R.art.L + ' km</b> Landstraße</li><li><i style="background:rgba(255,255,255,.45)"></i><b>' + R.art.B + ' km</b> Bundesstraße</li><li><i style="background:#ff5d5d"></i><b>' + R.art.A + ' km</b> Autobahn</li></ul></div>' +
      '<div class="dir" role="group" aria-label="Richtung" style="--c:' + R.farbe + '">' +
        '<button type="button" data-dir="hin" aria-pressed="' + (state.dir === 'hin') + '">Hinweg</button>' +
        '<button type="button" data-dir="zurueck" aria-pressed="' + (state.dir === 'zurueck') + '">Rückweg</button></div>' +
      '<div class="next" style="--c:' + R.farbe + '">' +
        (finished
          ? '<p class="next-k">Geschafft</p><p class="next-name">' + esc(list[last].name) + '</p><p class="next-info">' + list[last].cum + ' km ohne Autobahn. Gute Ankunft!</p>' +
            '<div class="next-row"><button type="button" class="btn-soft" id="prev">Zurück</button><button type="button" class="btn-soft" id="reset">Von vorne</button></div>'
          : '<p class="next-k">Etappe ' + cur + ' von ' + last + '</p>' +
            '<p class="next-name">' + esc(t.name) + '</p>' +
            '<p class="next-info">' + esc(from.name) + ' → ' + esc(t.name) + ' · ' + t.km + ' km · ca. ' + Math.max(5, Math.round(t.min / 5) * 5) + ' Min.' + (t.via.length ? '<br>über ' + esc(t.via.join(', ')) : '') + '</p>' +
            '<a class="btn-waze" href="' + waze(t) + '" target="_blank" rel="noopener">' + WAZE_ICON + 'In Waze öffnen</a>' +
            '<div class="next-row">' +
              '<button type="button" class="btn-soft" id="prev"' + (done === 0 ? ' disabled' : '') + '>Zurück</button>' +
              '<button type="button" class="btn-soft" id="arrived">' + (cur === last ? 'Angekommen' : 'Angekommen, weiter') + '</button>' +
            '</div>') +
        '<p class="hint">In Waze unter <b>Einstellungen → Navigation</b> „Autobahnen vermeiden“ einschalten, dann bleibt Waze zwischen den Etappen auf Land- und Bundesstraßen.</p>' +
      '</div>' +
      '<ol class="stages">' + list.map(function (s, i) {
        var cls = i <= done ? ' done' : (i === cur && !finished ? ' current' : '');
        var tags = '';
        if (s.tank) tags += '<span class="tag tank">Tankstopp</span>';
        if (s.name === R.pause) tags += '<span class="tag bed">Übernachtungstipp</span>';
        return '<li class="stage' + cls + '" style="--c:' + R.farbe + '">' +
          '<span class="st-n" aria-hidden="true">' + (i === 0 ? 'S' : i === list.length - 1 ? 'Z' : i) + '</span>' +
          '<div><p class="st-name">' + esc(s.name) + '</p>' + (s.note && s.note !== 'Start' && s.note !== 'Ziel' ? '<p class="st-note">' + esc(s.note) + '</p>' : '') +
          (s.via.length ? '<p class="st-via">über ' + esc(s.via.join(', ')) + '</p>' : '') + (tags ? '<div class="tags">' + tags + '</div>' : '') + '</div>' +
          (i === 0 ? '<p class="st-km">Start</p>' : '<p class="st-km"><b>+' + s.km + ' km</b> · gesamt ' + s.cum + ' km</p>') +
          (i === 0 ? '' : '<a class="st-go" href="' + waze(s) + '" target="_blank" rel="noopener" aria-label="' + esc(s.name) + ' in Waze öffnen">' + WAZE_ICON + 'Waze</a>') +
          '</li>';
      }).join('') + '</ol>';
    $('detail').innerHTML = html;
  }
  function render() { drawMap(); drawCards(); drawDetail(); }

  $('routes').addEventListener('click', function (e) {
    var b = e.target.closest('[data-route]');
    if (!b) return;
    state.route = b.getAttribute('data-route');
    save();
    render();
  });
  $('detail').addEventListener('click', function (e) {
    var b = e.target.closest('[data-dir]');
    var list = stages(state.route, state.dir), k = progressKey(), done = doneCount(list);
    if (b) { state.dir = b.getAttribute('data-dir'); save(); render(); return; }
    if (e.target.closest('#arrived')) state.done[k] = Math.min(done + 1, list.length - 1);
    else if (e.target.closest('#prev')) state.done[k] = Math.max(done - 1, 0);
    else if (e.target.closest('#reset')) state.done[k] = 0;
    else return;
    save();
    drawDetail();
    var next = document.querySelector('.next');
    if (next) next.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  });
  render();
})();
</script>
</body>
</html>
